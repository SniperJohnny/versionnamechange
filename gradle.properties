# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
#
# The mod supports every 26.x release from 26.1 up to 26.3, so check the build against the whole
# range before releasing. The default targets the newest version; to build/run against the older
# 26.1 line, override the Minecraft and Fabric API versions on the command line, e.g.
#   ./gradlew build -Pminecraft_version=26.1.2 -Pfabric_api_version=0.155.3+26.1.2
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=2.0.0-26.1-26.3
maven_group=io.sniperjohnny.github.versionnamechange

# Dependencies
fabric_api_version=0.162.0+26.3
